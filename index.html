<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVI REALM - V2</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JARVI V2">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/000000/ff0000?text=JARVI">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Amiri:wght@700&family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030000;
            color: #ff1a1a;
            font-family: 'Noto Sans Arabic', 'Amiri', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #260000 0%, #000000 95%);
        }

        /* تأثير التشويش المرعب */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 999;
        }

        #entry-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .dev-title {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #8b0000;
            margin-bottom: 8px;
            animation: pulseGlow 2s infinite alternate;
        }

        .realm-subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #800000;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 45px;
        }

        .enter-btn {
            background: rgba(40, 0, 0, 0.6);
            border: 2px solid #b30000;
            color: #ff3333;
            padding: 16px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 3px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(179, 0, 0, 0.5);
        }

        .enter-btn:active {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 40px #ff0000;
            transform: scale(0.96);
        }

        #countdown-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 90;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .countdown-number {
            font-size: 9rem;
            font-weight: 900;
            color: #ff0000;
            text-shadow: 0 0 50px #ff0000, 0 0 100px #660000;
            animation: pulse 1s infinite;
            font-family: 'Cinzel', serif;
        }

        #main-container {
            display: none;
            width: 100%;
            max-width: 680px;
            min-height: 100vh;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            z-index: 10;
        }

        .chat-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 25px;
            background: rgba(10, 0, 0, 0.85);
            border: 1px solid rgba(179, 0, 0, 0.4);
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.95), inset 0 0 20px rgba(179, 0, 0, 0.15);
        }

        .message {
            margin-bottom: 20px;
            line-height: 2.2;
            white-space: pre-wrap;
            font-size: 1.25rem;
            color: #e6e6e6;
            text-shadow: 0 0 4px rgba(255, 0, 0, 0.4);
        }

        .sub-trans {
            display: block;
            color: #666;
            font-size: 0.85rem;
            font-family: 'Cinzel', serif;
            margin-top: 8px;
            direction: ltr;
            text-align: right;
            letter-spacing: 1px;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .opt-btn {
            background: rgba(20, 0, 0, 0.9);
            border: 1px solid #660000;
            color: #cccccc;
            padding: 18px;
            border-radius: 4px;
            text-align: right;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        }

        .opt-btn:active {
            border-color: #ff0000;
            color: #ffffff;
            background: rgba(100, 0, 0, 0.7);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            width: 100%;
        }

        .custom-input {
            flex-grow: 1;
            background: #050000;
            border: 1px solid #660000;
            color: #fff;
            padding: 16px;
            border-radius: 4px;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
        }

        .custom-input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .send-btn {
            background: #330000;
            border: 1px solid #990000;
            color: #ff4d4d;
            padding: 0 25px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .send-btn:active {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.6; }
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px #ff0000; }
            100% { text-shadow: 0 0 25px #ff0000, 0 0 40px #8b0000; }
        }
    </style>
</head>
<body>

    <div id="entry-screen">
        <div class="dev-title">من صناعة وتطوير Why Matter</div>
        <div class="realm-subtitle">jarvi realm</div>
        <button class="enter-btn" onclick="startExperience()">[ دخول ]</button>
    </div>

    <div id="countdown-screen">
        <div class="countdown-number" id="cnt">3</div>
    </div>

    <div id="main-container">
        <div class="chat-box" id="chatBox">
            <div class="message" id="typewriterText"></div>
        </div>

        <div class="options-container" id="optionsBox" style="display: none;">
            <button class="opt-btn" onclick="selectOption('من أنت ؟')">
                من أنت ؟
                <span class="sub-trans">Who are you?</span>
            </button>
            <button class="opt-btn" onclick="selectOption('ما أسلوبك في القتال بالريلم ؟')">
                ما أسلوبك في القتال بالريلم ؟
                <span class="sub-trans">What is your fighting style in the realm?</span>
            </button>
            <button class="opt-btn" onclick="selectOption('ما الفكرة التي تريد أن أساعدك فيها ؟')">
                ما الفكرة التي تريد أن أساعدك فيها ؟
                <span class="sub-trans">What is the idea you want me to help you with?</span>
            </button>

            <div class="input-group">
                <input type="text" id="userInput" class="custom-input" placeholder="اسأل عن الممالك، الحروب، أو الأفكار...">
                <button class="send-btn" onclick="sendCustomQuestion()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        const heartbeatAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        const keyAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
        const beepAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
        
        heartbeatAudio.loop = true;

        function startExperience() {
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('countdown-screen').style.display = 'flex';
            
            heartbeatAudio.play().catch(() => {});

            let count = 3;
            const cntElem = document.getElementById('cnt');
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    cntElem.innerText = count;
                    beepAudio.currentTime = 0;
                    beepAudio.play().catch(() => {});
                } else {
                    clearInterval(timer);
                    document.getElementById('countdown-screen').style.display = 'none';
                    document.getElementById('main-container').style.display = 'flex';
                    initAIIntro();
                }
            }, 1000);
        }

        function typeWriter(text, elementId, speed = 35, callback = null) {
            const elem = document.getElementById(elementId);
            elem.innerHTML = '';
            let index = 0;

            function writeChar() {
                if (index < text.length) {
                    const char = text.charAt(index);
                    elem.textContent += char;
                    index++;
                    
                    if (char !== ' ') {
                        keyAudio.currentTime = 0;
                        keyAudio.play().catch(() => {});
                    }
                    setTimeout(writeChar, speed);
                } else if (callback) {
                    callback();
                }
            }
            writeChar();
        }

        function initAIIntro() {
            const introText = "مرحباً بك في JARVI REALM...\nأنا المساعد الذكي المخصص لخدمتك بالريلم. اختر من الخيارات أدناه أو اطرح سؤالك مباشر.";
            typeWriter(introText, 'typewriterText', 35, () => {
                document.getElementById('optionsBox').style.display = 'flex';
            });
        }

        function selectOption(arText) {
            processQuery(arText);
        }

        function sendCustomQuestion() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (val !== '') {
                processQuery(val);
                input.value = '';
            }
        }

        function processQuery(query) {
            const lowerQuery = query.toLowerCase();
            let response = "";

            if (lowerQuery.includes("من انت") || lowerQuery.includes("من أنت") || lowerQuery.includes("اسمك") || lowerQuery.includes("شسمك") || lowerQuery.includes("منو انت")) {
                response = "أنا مساعدك الخاص ، مستعد لمساعدتك وجعلك تتطور أكثر بالريلم .";
            }
            else if (lowerQuery.includes("قتال") || lowerQuery.includes("أسلوب") || lowerQuery.includes("فكرة") || lowerQuery.includes("مملكة") || lowerQuery.includes("حرب") || lowerQuery.includes("بناء") || lowerQuery.includes("ريلم") || lowerQuery.includes("ماين كرافت")) {
                if (lowerQuery.includes("قتال")) {
                    response = "أسلوب القتال بالريلم يعتمد على الاستراتيجية والخدع التكتيكية، واستخدام خطط المباغتة والدفاع عن القلاع بالريدستون.";
                } else if (lowerQuery.includes("فكرة")) {
                    response = "أستطيع مساعدتك في بناء فكرة مملكة مرعبة، أو تصميم نظام حماية تلقائي لقاعدتك باستخدام آليات الماين كرافت الذكية.";
                } else {
                    response = "أنا هنا لمساعدتك في كل ما يخص ريلم Jarvi من حروب، بناء ممالك، وتطوير المهارات.";
                }
            }
            else {
                response = "تم برمجتي من قبل المطور Why Matter للريلم المتواضع فقط .";
            }

            document.getElementById('optionsBox').style.display = 'none';
            typeWriter(response, 'typewriterText', 35, () => {
                setTimeout(() => {
                    document.getElementById('optionsBox').style.display = 'flex';
                }, 1500);
            });
        }
    </script>
</body>
</html>
