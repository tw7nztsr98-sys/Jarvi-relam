<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVI REALM</title>
    
    <!-- إعدادات تحويل الموقع إلى تطبيق على الآيفون iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JARVI">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/000000/ff0000?text=JARVI">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+Arabic:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Noto Sans Arabic', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* شاشة الدخول الأولى */
        #entry-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .dev-title {
            font-family: 'Cinzel', 'Noto Sans Arabic', serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .realm-subtitle {
            font-family: 'Cinzel', sans-serif;
            font-size: 1.1rem;
            color: #888888;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .enter-btn {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .enter-btn:active {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 25px #ff0000;
        }

        /* شاشة العد التنازلي */
        #countdown-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 90;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .countdown-number {
            font-size: 6rem;
            font-weight: 900;
            color: #ff0000;
            text-shadow: 0 0 30px #ff0000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }

        /* الحاوية الرئيسية للمحادثة */
        #main-container {
            display: none;
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            position: relative;
        }

        .chat-box {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 20px;
            line-height: 1.8;
            white-space: pre-wrap; /* يضمن الحفاظ على المسافات بدقة */
        }

        .bot-msg {
            color: #fff;
            font-size: 1.1rem;
        }

        .sub-trans {
            display: block;
            color: #555;
            font-size: 0.8rem;
            font-family: 'Cinzel', sans-serif;
            margin-top: 4px;
            direction: ltr;
            text-align: right;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .opt-btn {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            color: #ccc;
            padding: 14px;
            border-radius: 6px;
            text-align: right;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .opt-btn:active {
            border-color: #ff0000;
            color: #fff;
            background: rgba(40, 0, 0, 0.5);
        }

        /* خانة إدخال السؤال للـ AI */
        .input-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            width: 100%;
        }

        .custom-input {
            flex-grow: 1;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        .custom-input:focus {
            border-color: #666;
        }

        .send-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 0 18px;
            border-radius: 4px;
            cursor: pointer;
        }

        .send-btn:active {
            background: #ff0000;
            border-color: #ff0000;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة الدخول الأولى -->
    <div id="entry-screen">
        <div class="dev-title">من صناعة وتطوير Why Matter</div>
        <div class="realm-subtitle">jarvi</div>
        <button class="enter-btn" onclick="startExperience()">[ دخول ]</button>
    </div>

    <!-- 2. شاشة العد التنازلي -->
    <div id="countdown-screen">
        <div class="countdown-number" id="cnt">3</div>
    </div>

    <!-- 3. الواجهة الرئيسية للذكاء الاصطناعي -->
    <div id="main-container">
        <div class="chat-box" id="chatBox">
            <div class="message bot-msg" id="typewriterText"></div>
        </div>

        <div class="options-container" id="optionsBox" style="display: none;">
            <button class="opt-btn" onclick="selectOption('من أنت ؟', 'Who are you?')">
                من أنت ؟
                <span class="sub-trans">Who are you?</span>
            </button>
            <button class="opt-btn" onclick="selectOption('ما أسلوبك في القتال بالريلم ؟', 'What is your fighting style in the realm?')">
                ما أسلوبك في القتال بالريلم ؟
                <span class="sub-trans">What is your fighting style in the realm?</span>
            </button>
            <button class="opt-btn" onclick="selectOption('ما الفكرة التي تريد أن أساعدك فيها ؟', 'What is the idea you want me to help you with?')">
                ما الفكرة التي تريد أن أساعدك فيها ؟
                <span class="sub-trans">What is the idea you want me to help you with?</span>
            </button>

            <div class="input-group">
                <input type="text" id="userInput" class="custom-input" placeholder="اسأل عن الممالك، الحروب، أو الأفكار...">
                <button class="send-btn" onclick="sendCustomQuestion()">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        // إعداد المؤثرات الصوتية بروابط عالية الجودة
        const heartbeatAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        const keyAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3');
        const beepAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
        
        heartbeatAudio.loop = true;

        function startExperience() {
            document.getElementById('entry-screen').style.display = 'none';
            document.getElementById('countdown-screen').style.display = 'flex';
            
            // تشغيل صوت دقات القلب عند بداية التجربة
            heartbeatAudio.play().catch(() => {});

            let count = 3;
            const cntElem = document.getElementById('cnt');
            
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    cntElem.innerText = count;
                    beepAudio.currentTime = 0;
                    beepAudio.play().catch(() => {});
                } else {
                    clearInterval(timer);
                    document.getElementById('countdown-screen').style.display = 'none';
                    document.getElementById('main-container').style.display = 'flex';
                    initAIIntro();
                }
            }, 1000);
        }

        // دالة طباعة النصوص المعتمدة على المسافات الصريحة
        function typeWriter(text, elementId, speed = 40, callback = null) {
            const elem = document.getElementById(elementId);
            elem.innerHTML = '';
            let index = 0;

            function writeChar() {
                if (index < text.length) {
                    const char = text.charAt(index);
                    elem.textContent += char;
                    index++;
                    
                    if (char !== ' ') {
                        keyAudio.currentTime = 0;
                        keyAudio.play().catch(() => {});
                    }
                    setTimeout(writeChar, speed);
                } else if (callback) {
                    callback();
                }
            }
            writeChar();
        }

        function initAIIntro() {
            const introText = "مرحباً بك في JARVI REALM...\nأنا المساعد الذكي المخصص لخدمتك بالريلم. اختر من الخيارات أدناه أو اطرح سؤالك مباشر.";
            typeWriter(introText, 'typewriterText', 30, () => {
                document.getElementById('optionsBox').style.display = 'flex';
            });
        }

        function selectOption(arText, enText) {
            processQuery(arText);
        }

        function sendCustomQuestion() {
            const input = document.getElementById('userInput');
            const val = input.value.trim();
            if (val !== '') {
                processQuery(val);
                input.value = '';
            }
        }

        // المنطق الخاص بالردود الذكية الصارمة للـ AI
        function processQuery(query) {
            const lowerQuery = query.toLowerCase();
            let response = "";

            // 1. السؤال عن الهوية أو الاسم
            if (lowerQuery.includes("من انت") || lowerQuery.includes("من أنت") || lowerQuery.includes("اسمك") || lowerQuery.includes("شسمك") || lowerQuery.includes("منو انت")) {
                response = "أنا مساعدك الخاص ، مستعد لمساعدتك وجعلك تتطور أكثر بالريلم .";
            }
            // 2. الأسئلة الخاصة بالريلم وماين كرافت
            else if (lowerQuery.includes("قتال") || lowerQuery.includes("أسلوب") || lowerQuery.includes("فكرة") || lowerQuery.includes("مملكة") || lowerQuery.includes("حرب") || lowerQuery.includes("بناء") || lowerQuery.includes("ريلم") || lowerQuery.includes("ماين كرافت")) {
                if (lowerQuery.includes("قتال")) {
                    response = "أسلوب القتال بالريلم يعتمد على الاستراتيجية والخدع التكتيكية، واستخدام خطط المباغتة والدفاع عن القلاع بالريدستون.";
                } else if (lowerQuery.includes("فكرة")) {
                    response = "أستطيع مساعدتك في بناء فكرة مملكة مرعبة، أو تصميم نظام حماية تلقائي لقاعدتك باستخدام آليات الماين كرافت الذكية.";
                } else {
                    response = "أنا هنا لمساعدتك في كل ما يخص ريلم Jarvi من حروب، بناء ممالك، وتطوير المهارات.";
                }
            }
            // 3. أي سؤال خارجي عن الريلم
            else {
                response = "تم برمجتي من قبل المطور Why Matter للريلم المتواضع فقط .";
            }

            // طباعة الرد
            document.getElementById('optionsBox').style.display = 'none';
            typeWriter(response, 'typewriterText', 35, () => {
                setTimeout(() => {
                    document.getElementById('optionsBox').style.display = 'flex';
                }, 1500);
            });
        }
    </script>
</body>
</html>
