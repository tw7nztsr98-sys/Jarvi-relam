<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار الريلم - Why Matter</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161a22;
            --accent-color: #00ffcc;
            --text-color: #e6e6e6;
            --subtext-color: #8a99ad;
            --border-color: #242d3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: radial-gradient(circle at center, #131822 0%, #080a0c 100%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .screen {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            position: relative;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Screen 1: Welcome */
        .branding {
            font-size: 1.2rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            margin-bottom: 25px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .btn {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }

        .btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
        }

        /* Interactive Questions */
        .typing-container {
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .question-ar {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            min-height: 2.2rem;
        }

        .question-en {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-top: 6px;
            letter-spacing: 1px;
            min-height: 1.5rem;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            background: #0d1017;
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        /* Status / Loading Screen */
        .status-text {
            font-size: 1.2rem;
            color: var(--accent-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Profile Summary Card */
        .info-card {
            width: 100%;
            background: #0d1017;
            border-radius: 10px;
            padding: 20px;
            text-align: right;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-color);
        }

        .info-item {
            margin-bottom: 12px;
            font-size: 1.05rem;
        }

        .info-item span {
            color: var(--subtext-color);
            margin-left: 8px;
        }

        /* Chat Interface */
        .chat-box {
            width: 100%;
            height: 320px;
            overflow-y: auto;
            background: #0a0c0f;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .msg.bot {
            background: #1c2331;
            color: #fff;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
            border: 1px solid #2b364c;
        }

        .msg.user {
            background: var(--accent-color);
            color: #000;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
            font-weight: 700;
        }

        .chat-input-area {
            display: flex;
            width: 100%;
            gap: 10px;
        }

        .chat-input-area input {
            text-align: right;
        }

        .send-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 0 20px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- الشاشة الأولى: الترحيب -->
    <div id="screen-welcome" class="screen active">
        <div class="branding">تطوير وصناعة Why Matter</div>
        <button class="btn" onclick="startApp()">دخول</button>
    </div>

    <!-- الشاشة الثانية: الأسئلة المتتابعة -->
    <div id="screen-question" class="screen">
        <div class="typing-container">
            <div id="text-ar" class="question-ar"></div>
            <div id="text-en" class="question-en"></div>
        </div>
        <div id="input-container" class="input-group" style="display: none;">
            <input type="text" id="user-input" placeholder="اكتب إجابتك هنا..." autocomplete="off">
            <button class="btn" onclick="submitAnswer()">تأكيد</button>
        </div>
    </div>

    <!-- الشاشة الثالثة: الانتظار / رصد البيانات -->
    <div id="screen-status" class="screen">
        <div id="status-text" class="status-text"></div>
    </div>

    <!-- الشاشة الرابعة: كارت المعلومات -->
    <div id="screen-summary" class="screen">
        <div class="branding">ملف اللاعب بالريلم</div>
        <div class="info-card">
            <div class="info-item"><span>الاسم:</span> <strong id="sum-name"></strong></div>
            <div class="info-item"><span>أسلوب القتال:</span> <strong id="sum-style"></strong></div>
            <div class="info-item"><span>الهدف:</span> <strong id="sum-goal"></strong></div>
        </div>
        <button class="btn" onclick="enterChat()">بدء المحادثة مع المستشار</button>
    </div>

    <!-- الشاشة الخامسة: المحادثة AI -->
    <div id="screen-chat" class="screen">
        <div class="branding" style="font-size: 1rem; margin-bottom: 15px;">مستشار الريلم الذكي</div>
        <div class="chat-box" id="chat-box">
            <div class="msg bot">تم تطويري وصناعتي من قبل Why Matter لأكون عصاك اللي ما تعصاك.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="اسأل المستشار..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendChatMessage()">إرسال</button>
        </div>
    </div>

</div>

<script>
    // Audio Context لتوليد أصوات طباعة ومؤثرات سينمائية دون الحاجة لملفات خارجية
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTypeSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
    }

    function playEraseSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300 - Math.random() * 50, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
    }

    // إدارة الأسئلة والإجابات
    const questions = [
        { ar: "من انت ؟", en: "WHO ARE YOU?" },
        { ar: "ما اسلوب قتالك في الريلم ؟", en: "WHAT IS YOUR COMBAT STYLE IN THE REALM?" },
        { ar: "ما هو هدفك الأساسي ؟", en: "WHAT IS YOUR MAIN GOAL?" }
    ];

    let currentStep = 0;
    let userData = { name: "", style: "", goal: "" };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startApp() {
        showScreen('screen-question');
        typeQuestion(questions[currentStep].ar, questions[currentStep].en);
    }

    // دالة كتابة النص حرف حرف
    function typeQuestion(textAr, textEn, callback) {
        let arIndex = 0;
        let enIndex = 0;
        const elAr = document.getElementById('text-ar');
        const elEn = document.getElementById('text-en');
        const inputContainer = document.getElementById('input-container');
        
        elAr.innerHTML = "";
        elEn.innerHTML = "";
        inputContainer.style.display = "none";

        let arInterval = setInterval(() => {
            if (arIndex < textAr.length) {
                elAr.innerHTML += textAr.charAt(arIndex);
                playTypeSound();
                arIndex++;
            } else {
                clearInterval(arInterval);
                let enInterval = setInterval(() => {
                    if (enIndex < textEn.length) {
                        elEn.innerHTML += textEn.charAt(enIndex);
                        playTypeSound();
                        enIndex++;
                    } else {
                        clearInterval(enInterval);
                        inputContainer.style.display = "flex";
                        document.getElementById('user-input').focus();
                        if (callback) callback();
                    }
                }, 40);
            }
        }, 60);
    }

    // دالة مسح النص حرف حرف (تأثير الشخص الذي يمسح)
    function eraseQuestion(callback) {
        const elAr = document.getElementById('text-ar');
        const elEn = document.getElementById('text-en');
        document.getElementById('input-container').style.display = "none";

        let eraseInterval = setInterval(() => {
            let arLen = elAr.innerHTML.length;
            let enLen = elEn.innerHTML.length;

            if (enLen > 0) {
                elEn.innerHTML = elEn.innerHTML.substring(0, enLen - 1);
                playEraseSound();
            } else if (arLen > 0) {
                elAr.innerHTML = elAr.innerHTML.substring(0, arLen - 1);
                playEraseSound();
            } else {
                clearInterval(eraseInterval);
                if (callback) callback();
            }
        }, 30);
    }

    function submitAnswer() {
        const inputVal = document.getElementById('user-input').value.trim();
        if (!inputVal) return;

        if (currentStep === 0) userData.name = inputVal;
        else if (currentStep === 1) userData.style = inputVal;
        else if (currentStep === 2) userData.goal = inputVal;

        document.getElementById('user-input').value = "";

        eraseQuestion(() => {
            if (currentStep === 0) {
                showStatus("تم رصد الاسم ... الرجاء الانتظار قليلاً", () => {
                    currentStep++;
                    showScreen('screen-question');
                    typeQuestion(questions[currentStep].ar, questions[currentStep].en);
                });
            } else if (currentStep < questions.length - 1) {
                currentStep++;
                typeQuestion(questions[currentStep].ar, questions[currentStep].en);
            } else {
                showSummary();
            }
        });
    }

    function showStatus(msg, callback) {
        showScreen('screen-status');
        const statusEl = document.getElementById('status-text');
        statusEl.innerText = msg;
        setTimeout(() => {
            if (callback) callback();
        }, 2200);
    }

    function showSummary() {
        document.getElementById('sum-name').innerText = userData.name;
        document.getElementById('sum-style').innerText = userData.style;
        document.getElementById('sum-goal').innerText = userData.goal;
        showScreen('screen-summary');
    }

    function enterChat() {
        showScreen('screen-chat');
    }

    // منطق المستشار الذكي AI
    function sendChatMessage() {
        const inputEl = document.getElementById('chat-input');
        const text = inputEl.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        inputEl.value = "";

        setTimeout(() => {
            let reply = getAIReply(text);
            addMessage(reply, 'bot');
        }, 600);
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendChatMessage();
    }

    function addMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function getAIReply(query) {
        const q = query.toLowerCase();
        
        // الرد التلقائي للتعريف بنفسه
        if (q.includes("من انت") || q.includes("من أنت") || q.includes("عرف عن نفسك") || q.includes("مين انت")) {
            return "تم تطويري وصناعتي من قبل Why Matter لأكون عصاك اللي ما تعصاك.";
        }

        // الكلمات المتعلقة بـ ماينكرافت والريلم
        const realmKeywords = ["ريلم", "ماينكرافت", "ريدستون", "بناء", "وحوش", "قتال", "سيف", "دروع", "مملكة", "قرية", "realm", "minecraft", "سيرفر", "فارم", "مزرعة", "دايموند", "نذر"];
        
        const isRealmRelated = realmKeywords.some(keyword => q.includes(keyword));

        if (isRealmRelated) {
            if (q.includes("ريدستون")) {
                return `أهلاً بك يا ${userData.name}. بالنسبة للريدستون في الريلم، أنصحك دائمًا بتخفيف المقارنات التكرارية (Repeaters) لتقليل اللاق بالسيرفر، واعتمد على التصاميم المدمجة!`;
            }
            if (q.includes("قتال") || q.includes("سلاح") || q.includes("دروع")) {
                return `بما أن أسلوبك في القتال هو (${userData.style})، تأكد من تطوير دروعك بتطويرات Protection IV و Unbreaking III، ولا تنسَ تفاح الموت (Golden Apples) قبل أي مواجهة!`;
            }
            return `أنا هنا لخدمتك وتحقيق هدفك (${userData.goal}) داخل الريلم. اعطني سؤالك المحدد عن ماينكرافت أو استراتيجيات السيرفر وسأوجهك مباشرة!`;
        } else {
            // أي موضوع خارج الريلم
            return "تم تطويري لأساعدك فقط بالريلم.";
        }
    }
</script>

</body>
</html>
