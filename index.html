<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Nosifer&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #000000;
            color: #ff0000;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* خلفية رعب سينمائية مع ضباب ودمار خفي */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a0000 0%, #000000 85%);
            z-index: -2;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(255,0,0,0.03) 1px, transparent 2px);
            pointer-events: none;
            z-index: -1;
        }

        /* شاشة البصمة والتطوير */
        #splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 25px;
            z-index: 10;
            transition: opacity 1s ease;
        }

        .dev-title {
            font-family: 'Nosifer', cursive;
            font-size: 1.8rem;
            color: #d40000;
            text-align: center;
            text-shadow: 0 0 10px #ff0000, 0 0 25px #660000, 0 0 40px #330000;
            letter-spacing: 2px;
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #500000; transform: scale(1); }
            100% { text-shadow: 0 0 20px #ff3333, 0 0 40px #990000, 0 0 60px #ff0000; transform: scale(1.02); }
        }

        .fingerprint-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            margin-top: 15px;
        }

        .fingerprint-btn {
            width: 100px;
            height: 100px;
            border: 2px solid #660000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 0, 0, 0.6);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .fingerprint-btn svg {
            width: 55px;
            height: 55px;
            fill: #990000;
            transition: all 0.4s ease;
        }

        .fingerprint-container:hover .fingerprint-btn {
            border-color: #ff0000;
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.6), inset 0 0 15px rgba(255, 0, 0, 0.4);
            transform: scale(1.08);
        }

        .fingerprint-container:hover .fingerprint-btn svg {
            fill: #ff0000;
            filter: drop-shadow(0 0 8px #ff0000);
        }

        .fingerprint-hint {
            color: #884444;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* شاشة العد التنازلي المرعب */
        #countdown-screen {
            display: none;
            font-size: 10rem;
            font-weight: 900;
            color: #cc0000;
            text-shadow: 0 0 30px #ff0000, 0 0 60px #660000, 0 0 90px #330000;
            z-index: 10;
        }

        .glitch-anim {
            animation: bloodShake 0.8s infinite;
        }

        @keyframes bloodShake {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); }
            20% { transform: translate(-3px, 3px) scale(1.05); filter: hue-rotate(-15deg); }
            40% { transform: translate(3px, -2px) scale(0.98); filter: hue-rotate(15deg); }
            60% { transform: translate(-2px, -3px) scale(1.02); filter: hue-rotate(0deg); }
            80% { transform: translate(2px, 2px) scale(1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* حاوية المحادثة التفاعلية والتصميم المرعب */
        #chat-container {
            display: none;
            flex-direction: column;
            width: 90%;
            max-width: 750px;
            height: 85vh;
            background: rgba(10, 0, 0, 0.85);
            border: 2px solid #550000;
            box-shadow: 0 0 40px rgba(153, 0, 0, 0.4), inset 0 0 25px rgba(30, 0, 0, 0.9);
            border-radius: 12px;
            z-index: 10;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            background: linear-gradient(90deg, #1f0000, #3a0000, #1f0000);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #660000;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ff3333;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #ff0000;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeInMsg 0.5s ease forwards;
        }

        @keyframes fadeInMsg {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.system {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1.05rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .message.system .bubble {
            background: rgba(40, 0, 0, 0.7);
            border: 1px solid #770000;
            color: #ff4d4d;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.15);
        }

        .message.user .bubble {
            background: rgba(70, 0, 0, 0.8);
            border: 1px solid #ff1a1a;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .translation {
            font-size: 0.8rem;
            color: #aaaaaa;
            margin-top: 6px;
            font-style: italic;
            letter-spacing: 0.5px;
            opacity: 0.85;
        }

        .chat-input-area {
            padding: 15px;
            background: rgba(15, 0, 0, 0.95);
            border-top: 2px solid #550000;
            display: flex;
            gap: 12px;
        }

        .chat-input-area input {
            flex: 1;
            background: #050000;
            border: 1px solid #770000;
            padding: 12px 16px;
            border-radius: 6px;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input-area input:focus {
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .chat-input-area button {
            background: linear-gradient(135deg, #700000, #300000);
            border: 1px solid #ff0000;
            color: #ffcccc;
            padding: 0 24px;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .chat-input-area button:hover {
            background: linear-gradient(135deg, #a00000, #500000);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
            transform: scale(1.03);
        }

        /* مؤشر التحميل الدموي */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px;
            align-self: flex-start;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #ff0000;
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
            box-shadow: 0 0 6px #ff0000;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: البصمة والتطوير -->
    <div id="splash-screen">
        <div class="dev-title">تطوير وصناعة : WHY MATTER</div>
        <div class="fingerprint-container" onclick="startRitual()">
            <div class="fingerprint-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 13.88 3 12 3c-1.88 0-3.66.42-5.58 1.41-.15.08-.33.05-.45-.07-.12-.12-.15-.3-.07-.45C8.01 2.82 9.97 2.38 12 2.38c2.03 0 3.99.44 6.1 1.51.15.08.21.26.13.41-.05.11-.14.17-.24.17zM12 5.5c-1.55 0-3.04.35-4.48 1.05-.15.07-.33.02-.41-.13-.07-.15-.02-.33.13-.41C8.7 5.2 10.3 4.8 12 4.8c1.7 0 3.3.4 4.76 1.11.15.08.21.26.13.41-.07.15-.25.2-.41.13C15.04 5.85 13.55 5.5 12 5.5zm0 2.25c-1.22 0-2.4.28-3.55.85-.15.07-.33.01-.4-.14-.07-.15-.01-.33.14-.4C9.42 7.7 10.7 7.4 12 7.4c1.3 0 2.58.3 3.81.91.15.07.21.25.14.4-.07.15-.25.21-.4.14-1.15-.57-2.33-.85-3.55-.85zm0 2.25c-.88 0-1.74.2-2.58.62-.15.07-.33.01-.4-.14-.07-.15-.01-.33.14-.4.92-.47 1.84-.7 2.84-.7 1 0 1.92.23 2.84.7.15.07.21.25.14.4-.07.15-.25.21-.4.14-.84-.42-1.7-.62-2.58-.62zM12 12c-1.1 0-2 .9-2 2 0 .74.41 1.38 1.02 1.72.13.07.2.22.16.36-.12.44-.18.9-.18 1.37 0 .5.1.98.28 1.43.05.13-.01.28-.14.33-.13.05-.28-.01-.33-.14-.21-.54-.33-1.12-.33-1.72 0-.54.07-1.07.2-1.57C9.9 14.88 9 13.55 9 12c0-1.66 1.34-3 3-3s3 1.34 3 3c0 1.55-.9 2.88-2.22 3.48.13.5.2 1.03.2 1.57 0 .6-.12 1.18-.33 1.72-.05.13-.2.19-.33.14-.13-.05-.19-.2-.14-.33.18-.45.28-.93.28-1.43 0-.47-.06-.93-.18-1.37-.04-.14.03-.29.16-.36.61-.34 1.02-.98 1.02-1.72 0-1.1-.9-2-2-2z"/>
        </svg>
            </div>
            <div class="fingerprint-hint">التحقق بالبصمة للدخول</div>
        </div>
    </div>

    <!-- الشاشة الثانية: العد التنازلي -->
    <div id="countdown-screen" class="glitch-anim">5</div>

    <!-- الشاشة الثالثة: المحادثة التفاعلية -->
    <div id="chat-container">
        <div class="chat-header">JARVI - REALM ADVISOR</div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area" id="input-area" style="display: none;">
            <input type="text" id="user-input" placeholder="اكتب إجابتك هنا..." autocomplete="off">
            <button onclick="handleUserSubmit()">إرسال</button>
        </div>
    </div>

    <script>
        let step = 0;
        let userData = {
            name: "",
            fightingStyle: ""
        };

        // أصوات تفاعلية عبر Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playBeep(frequency, duration, type = 'sine') {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playKeyClick() {
            playBeep(800 + Math.random() * 400, 0.04, 'triangle');
        }

        function startRitual() {
            playBeep(200, 0.8, 'sawtooth');
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                const cdScreen = document.getElementById('countdown-screen');
                cdScreen.style.display = 'block';
                runCountdown(5);
            }, 1000);
        }

        function runCountdown(count) {
            const cdScreen = document.getElementById('countdown-screen');
            cdScreen.innerText = count;
            playBeep(120 - count * 15, 0.6, 'sawtooth');

            if (count > 1) {
                setTimeout(() => runCountdown(count - 1), 1000);
            } else {
                setTimeout(() => {
                    cdScreen.style.display = 'none';
                    const chatCont = document.getElementById('chat-container');
                    chatCont.style.display = 'flex';
                    startConversation();
                }, 1000);
            }
        }

        function appendMessage(sender, text, translation = "") {
            const messagesDiv = document.getElementById('chat-messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            msgDiv.appendChild(bubbleDiv);

            if (translation) {
                const transDiv = document.createElement('div');
                transDiv.className = 'translation';
                transDiv.innerText = translation;
                msgDiv.appendChild(transDiv);
            }

            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return bubbleDiv;
        }

        async function typeWriter(element, text, speed = 40) {
            for (let i = 0; i < text.length; i++) {
                element.innerText += text.charAt(i);
                playKeyClick();
                await new Promise(r => setTimeout(r, speed));
            }
        }

        async function showSystemMessage(text, translation = "") {
            const bubble = appendMessage('system', '', translation);
            await typeWriter(bubble, text);
        }

        async function startConversation() {
            step = 1;
            await showSystemMessage("من أنت ؟", "Who are you?");
            document.getElementById('input-area').style.display = 'flex';
            document.getElementById('user-input').focus();
        }

        async function handleUserSubmit() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            appendMessage('user', text);
            document.getElementById('input-area').style.display = 'none';

            if (step === 1) {
                userData.name = text;
                await showSystemMessage(`تم رصد الاسم…. الرجاء الانتظار قليلاً`, "Name detected…. Please wait a moment");
                
                setTimeout(async () => {
                    // مسح الرسالة السابقة وتجهيز السؤال التالي
                    step = 2;
                    await showSystemMessage("ما أسلوبك في القتال بالريلم ؟", "What is your fighting style in the Realm?");
                    document.getElementById('input-area').style.display = 'flex';
                    document.getElementById('user-input').focus();
                }, 3000);

            } else if (step === 2) {
                userData.fightingStyle = text;
                await showSystemMessage(`تم تسجيل أسلوبك القتالي في سجلات الريلم بنجاح.`, "Fighting style successfully recorded in Realm logs.");

                setTimeout(async () => {
                    step = 3;
                    await showSystemMessage("ما الفكرة التي تريد أن أساعدك فيها ؟ (مثل: تصميم مملكة، بناء سيف دايموند، خطة حراتيجية...)", "What idea do you need help with? (e.g., Kingdom design, Diamond sword building, strategic plan...)");
                    document.getElementById('input-area').style.display = 'flex';
                    document.getElementById('user-input').focus();
                }, 2000);

            } else if (step >= 3) {
                // إظهار مؤشر الكتابة للذكاء الاصطناعي
                const typingInd = document.createElement('div');
                typingInd.className = 'typing-indicator';
                typingInd.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
                document.getElementById('chat-messages').appendChild(typingInd);
                document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;

                const reply = await callGeminiAI(text);
                typingInd.remove();
                
                const bubble = appendMessage('system', '');
                await typeWriter(bubble, reply);
                document.getElementById('input-area').style.display = 'flex';
                document.getElementById('user-input').focus();
            }
        }

        async function callGeminiAI(prompt) {
            // التحقق من الأسئلة المتعلقة بالهوية والصانع
            const lowerPrompt = prompt.toLowerCase();
            if (lowerPrompt.includes("من انت") || lowerPrompt.includes("من برمجك") || lowerPrompt.includes("من صنعك") || lowerPrompt.includes("من هو صانعك") || lowerPrompt.includes("who are you")) {
                return "تم برمجتي والعمل علي من قبل Why Matter لأكون مساعدك الشخصي وعصاك التي لا تعصاك";
            }

            const apiKey = ""; // سيتم تفعيل الاتصال المباشر بمساعد ماينكرافت الذكي
            const systemPrompt = `أنت مساعد ذكي مخصص للعبة ماينكرافت (Minecraft Realm - نظام الممالك والحروب). 
المحارب الحالي اسمه: ${userData.name} وأسلوبه القتالي: ${userData.fightingStyle}.
قوانين صارمة جداً يجب التزامها في كل إجابة:
1. إذا سأل المستخدم عن أي شيء خارج نطاق ماينكرافت، أو خارج احتياجات الريلم، أو قام بسؤال عام لا علاقة له باللعبة أو الممالك أو التطوير، أجب حصراً بهذه العبارة الدقيقة دون زيادة أو نقصان: "تم تطويري وبرمجتي من Why Matter للمساعدة في احتياجات الريلم ومساعدة الأعضاء فقط".
2. ساعد الأعضاء بتقديم خطط استراتيجية دقيقة، أفكار لتصميم القلاع والممالك، وصفات تطوير الأسلحة والدروع (مثل Diamond Sword، Netherite، Redstone contraptions).
3. تحدث بطبيعة حماسية وذكية وخبرة عميقة بماينكرافت.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: "user", parts: [{ text: systemPrompt + "\n\nسؤال المستخدم: " + prompt }] }
                        ]
                    })
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    return data.candidates[0].content.parts[0].text;
                }
            } catch (e) {
                console.error(e);
            }
            return "حدث خطس في بوابات الريلم المظلمة. حاول مجدداً يا سيد " + userData.name;
        }

        // دعم الضغط على زر Enter للإرسال
        document.getElementById('user-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleUserSubmit();
            }
        });
    </script>
</body>
</html>
